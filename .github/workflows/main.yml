name: build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - 'circuit'

jobs:
  build:
    runs-on: ubuntu-24.04
    continue-on-error: false

    strategy:
      matrix:
        target-hardware:
          - esp32

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get ESP32 OTA component
        run: |
          git submodule update --init components/corsacOTA

      - name: Build for ESP32
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v4.4.2
          target: esp32
          path: './'

      - name: Merge bin files
        run: |
          git clone https://github.com/espressif/esptool.git

          python3 -m pip install --upgrade pip
          python3 -m pip install ./esptool

          python3 ./esptool/esptool.py \
            --chip esp32 \
            merge_bin \
            -o build/wireless_esp_dap_full.bin \
            0x1000 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/wireless_esp_dap.bin

          mv \
            build/wireless_esp_dap.bin \
            build/wireless_esp_dap_app.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware_esp32
          path: |
            build/wireless_esp_dap_full.bin
            build/wireless_esp_dap_app.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
